[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streetsign-detector"
version = "0.1.0"
description = "Street sign / house-number detector: YOLO detection + EfficientNet reader."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "ultralytics",
  "Pillow",
  "tqdm",
  "numpy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
